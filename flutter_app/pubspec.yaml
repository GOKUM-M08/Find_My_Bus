name: bustrack
description: School Bus Tracking App

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^2.27.1
  firebase_messaging: ^14.7.19
  geolocator: ^11.0.0
  http: ^1.2.1
  fl_chart: ^0.68.0
  provider: ^6.1.2
  url_launcher: ^6.3.0
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
