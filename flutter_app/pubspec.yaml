name: bustrack
description: School Bus Tracking App

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  google_maps_flutter: ^2.5.3
  firebase_core: ^2.27.1
  firebase_messaging: ^14.7.19
  geolocator: ^11.0.0
  http: ^1.2.1
  provider: ^6.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21